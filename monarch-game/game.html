<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Milkweed — A Monarch's Beginning</title>
<style>
  :root{
    --leaf-dark:#2f5233;
    --leaf-mid:#4f7942;
    --leaf-light:#7a9b5c;
    --stem:#5c6b3a;
    --cream:#f4e9d8;
    --monarch-orange:#e8722c;
    --monarch-black:#2b2320;
    --sky-dawn:#f7c9a0;
    --sky-day:#a7d8e8;
    --storm-dark:#1c1d2e;
    --lightning:#eef0ff;
    --egg-glow:#fff7d6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--monarch-black);
    font-family:'Courier New',monospace;
    color:var(--cream);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  #wrap{
    position:relative;
    width:100%;
    max-width:640px;
    margin:0 auto;
    aspect-ratio:4/3;
    background:#000;
    image-rendering:pixelated;
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }
  #overlay{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:16px;
    pointer-events:none;
  }
  #overlay.pos-bottom{
    align-items:flex-end;
    justify-content:center;
    padding-bottom:8%;
  }
  #overlay.pos-top{
    align-items:flex-start;
    justify-content:center;
    padding-top:8%;
  }
  #overlay.pos-top-left{
    align-items:flex-start;
    justify-content:flex-start;
    text-align:left;
    padding:10px;
  }
  #overlay.pos-top-left .panel-text{
    max-width:66%;
    font-size:clamp(11px,2.6vw,15px);
  }
  .panel-text{
    background:rgba(20,16,14,0.72);
    border:2px solid var(--cream);
    padding:10px 16px;
    font-size:clamp(11px,2.4vw,15px);
    line-height:1.5;
    letter-spacing:0.5px;
    max-width:88%;
    pointer-events:auto;
  }
  #skipBtn, #continueBtn{
    position:absolute;
    background:var(--monarch-black);
    color:var(--cream);
    border:2px solid var(--monarch-orange);
    font-family:inherit;
    font-size:11px;
    padding:6px 10px;
    cursor:pointer;
    pointer-events:auto;
    letter-spacing:1px;
  }
  #skipBtn{top:8px;right:8px;}
  #continueBtn{
    bottom:14%;left:50%;transform:translateX(-50%);
    font-size:12px;padding:8px 14px;
    display:none;
  }
  #continueBtn.show{display:block;}
  #hud{
    position:absolute;top:6px;left:6px;
    display:flex;gap:3px;
    pointer-events:none;
  }
  .munch{
    width:16px;height:16px;
    background:transparent;
    position:relative;
  }
  .munch svg{width:100%;height:100%;display:block;}
  #hint{
    position:absolute;
    bottom:6px;left:0;right:0;
    text-align:center;
    font-size:10px;
    color:var(--cream);
    text-shadow:1px 1px 0 #000;
    pointer-events:none;
    letter-spacing:0.5px;
  }
  #controls{
    position:absolute;
    bottom:6px;right:6px;
    display:grid;
    grid-template-columns:28px 28px 28px;
    grid-template-rows:28px 28px 28px;
    gap:2px;
    opacity:0.85;
  }
  #controls button{
    background:rgba(20,16,14,0.6);
    border:1px solid var(--cream);
    color:var(--cream);
    font-size:12px;
    cursor:pointer;
  }
  #eatBtn, #silkBtn{
    position:absolute;
    bottom:6px;
    width:52px;height:36px;
    background:rgba(232,114,44,0.85);
    border:1px solid var(--cream);
    color:var(--monarch-black);
    font-weight:bold;
    font-size:10px;
    cursor:pointer;
  }
  #eatBtn{left:6px;}
  #silkBtn{left:64px;background:rgba(122,155,92,0.85);}
  #toast{
    position:absolute;
    top:34px;left:50%;transform:translateX(-50%);
    background:rgba(20,16,14,0.85);
    border:1px solid var(--monarch-orange);
    padding:5px 10px;
    font-size:10px;
    max-width:80%;
    text-align:center;
    opacity:0;
    transition:opacity 0.3s;
    pointer-events:none;
  }
  #toast.show{opacity:1;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="160" height="120"></canvas>
  <div id="hud"></div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="overlay">
    <div class="panel-text" id="panelText" style="display:none;"></div>
  </div>
  <button id="skipBtn">SKIP INTRO ▶</button>
  <button id="continueBtn">CONTINUE ▶</button>
  <div id="controls">
    <div></div><button id="btnUp">▲</button><div></div>
    <button id="btnLeft">◀</button><div></div><button id="btnRight">▶</button>
    <div></div><button id="btnDown">▼</button><div></div>
  </div>
  <button id="eatBtn">EAT<br>(space)</button>
  <button id="silkBtn">SPIN SILK<br>(S)</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = canvas.width, H = canvas.height;
let CELL = 4;
let COLS = W / CELL, ROWS = H / CELL;
function setGrid(c){ CELL = c; COLS = W / CELL; ROWS = H / CELL; }
// body: 1 cell wide x 3 cells tall (instar 1). Buffer = 1-cell border -> 3x5 no-eat zone.
const BODY_W = 1, BODY_H = 3;

const overlay = document.getElementById('overlay');
const panelText = document.getElementById('panelText');
const skipBtn = document.getElementById('skipBtn');
const continueBtn = document.getElementById('continueBtn');
const hud = document.getElementById('hud');
const hint = document.getElementById('hint');
const toast = document.getElementById('toast');
const eatBtn = document.getElementById('eatBtn');
const silkBtn = document.getElementById('silkBtn');
const controlsEl = document.getElementById('controls');

function setGameplayControlsVisible(visible){
  const v = visible ? 'block' : 'none';
  eatBtn.style.display = v;
  silkBtn.style.display = v;
  controlsEl.style.display = visible ? 'grid' : 'none';
}
setGameplayControlsVisible(false); // hidden until Act 0 actually starts

let state = 'comic'; // comic -> act0 -> storm -> morning -> instar2wake -> act1 -> act1molt -> instar3wake
let comicIndex = 0;
let frame = 0;

function showToast(msg, ms=2200){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove('show'), ms);
}

/* ---------- pixel helpers ---------- */
function px(x,y,w,h,color){
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}
function clear(color){ px(0,0,W,H,color); }

/* ---------- MUNCH HUD ---------- */
let TOTAL_MUNCH = 5;   // grows to 10 in instar 2
let munchFilled = 1; // egg gift from mother

function leafletSVG(filled){
  const fillColor = filled ? '#5f9a44' : 'transparent';
  const veinColor = filled ? 'rgba(244,233,216,0.7)' : 'transparent';
  return `<svg viewBox="0 0 16 16">
    <path d="M8 1 C 3 3, 1 8, 8 15 C 15 8, 13 3, 8 1 Z"
      fill="${fillColor}" stroke="#5b3a21" stroke-width="1.4"/>
    <path d="M8 3 L 8 13" stroke="${veinColor}" stroke-width="0.8"/>
  </svg>`;
}
function renderHUD(){
  hud.innerHTML = '';
  for(let i=0;i<TOTAL_MUNCH;i++){
    const d = document.createElement('div');
    d.className='munch';
    d.innerHTML = leafletSVG(i < munchFilled);
    hud.appendChild(d);
  }
}
renderHUD();

/* =========================================================
   COMIC INTRO — broken into short beats so text never sits
   on top of the art it's describing. Each beat is a small
   step forward in the action, not a whole scene at once.
   ========================================================= */
const comicPanels = [
  { draw: drawBeatEstablish,   text: "High in a milkweed patch..." },
  { draw: drawBeatButterflyIn, text: "...a mother monarch settles in." },
  { draw: drawBeatPerched,     text: "On a leaf, she rests." },
  { draw: drawBeatSpark,       text: "A single spark of life leaves her..." },
  { draw: drawBeatEggAppear,   text: "...and becomes a single egg." },
  { draw: drawBeatEggGlow,     text: "Warmed by the sun, three quiet days pass." },
  { draw: drawBeatEggDark,     text: "A dark spot appears. Someone is waiting inside." },
  { draw: drawBeatCrack,       text: "Crack..." },
  { draw: drawBeatHatch,       text: "Hungry. Alive." }
];

// shared background used by the mother/egg-laying beats (leaf sits upper-mid,
// leaving the bottom third clear for text)
function drawSkyLeafUpper(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#f7c9a0');
  g.addColorStop(1, '#fce8cf');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  px(120,14,14,14,'#ffe08a'); // sun
  px(78,40,6,80,'#5c6b3a');   // stem
  drawLeafBlob(50,50,70,40,'#4f7942');
}
// shared background used by the egg-development beats (leaf sits lower,
// leaving the top third clear for text)
function drawSkyLeafLower(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#a7d8e8'); g.addColorStop(1,'#f7c9a0');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  drawLeafBlob(20,60,120,50,'#4f7942');
}

function drawBeatEstablish(t){
  drawSkyLeafUpper();
}
function drawBeatButterflyIn(t){
  drawSkyLeafUpper();
  const p = Math.min(1, t/70);
  const bx = -10 + (70-(-10))*p;
  const bob = Math.sin(t/8)*2;
  drawButterfly(bx, 44+bob, '#e8722c');
  drawMotherMunchRow(15, 6);
}
function drawBeatPerched(t){
  drawSkyLeafUpper();
  const bob = Math.sin(t/20)*1;
  drawButterfly(70, 44+bob, '#e8722c');
  drawMotherMunchRow(15, 6);
}
function drawBeatSpark(t){
  drawSkyLeafUpper();
  drawButterfly(70, 44, '#e8722c');
  const p = Math.min(1, t/150);
  const sx = 70 + (84-70)*p;
  const sy = 50 + (58-50)*p;
  px(sx, sy, 2,2, '#fff7d6');
  drawMotherMunchRow(15, 6);
}
function drawBeatEggAppear(t){
  drawSkyLeafUpper();
  drawButterfly(70, 44, '#e8722c');
  px(84,58,3,3,'#fff7d6');
  const flashP = Math.min(1, t/40);
  ctx.fillStyle = `rgba(122,155,92,${0.5*(1-flashP)})`;
  ctx.beginPath(); ctx.arc(85,59,6,0,Math.PI*2); ctx.fill();

  // one filled container pulses, then is gone for good — it became the egg's
  if(flashP < 1){
    const pulseAlpha = 0.35 + 0.65*Math.abs(Math.sin(t/3));
    drawMotherMunchRow(15, 6, 5, pulseAlpha);
  } else {
    drawMotherMunchRow(14, 5);
  }
}
function drawBeatEggGlow(t){
  drawSkyLeafLower();
  const glow = 4 + Math.sin(t/28)*2;
  ctx.fillStyle='rgba(255,247,214,0.5)';
  ctx.beginPath();
  ctx.arc(80,64,7+glow,0,Math.PI*2);
  ctx.fill();
  px(76,60,8,8,'#fff7d6');
}
function drawBeatEggDark(t){
  drawSkyLeafLower();
  px(76,60,8,8,'#fff7d6');
  px(78,63,4,4,'#2b2320'); // dark spot = larva head visible
}
function drawBeatCrack(t){
  drawSkyLeafLower();
  px(76,60,8,8,'#fff7d6');
  px(78,63,4,4,'#2b2320');
  ctx.strokeStyle='#2b2320'; ctx.lineWidth=0.6;
  const shake = Math.sin(t/3)*0.4;
  ctx.beginPath(); ctx.moveTo(76,62+shake); ctx.lineTo(80,66-shake); ctx.stroke();
}
function drawBeatHatch(t){
  drawSkyLeafLower();
  px(76,62,10,5,'#4f7942');
  px(78,60,2,2,'#2b2320');
  px(83,60,2,2,'#2b2320');
}

function drawLeafBlob(x,y,w,h,color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x+w/2, y+h/2, w/2, h/2, 0, 0, Math.PI*2);
  ctx.fill();
  // vein
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, y+h/2);
  ctx.lineTo(x+w, y+h/2);
  ctx.stroke();
}
function drawButterfly(x,y,color){
  px(x-6,y-4,6,8,color);
  px(x+2,y-4,6,8,color);
  px(x-1,y-3,3,7,'#2b2320');
  px(x-5,y-2,3,3,'#2b2320');
  px(x+3,y-2,3,3,'#2b2320');
}

// mother's own MUNCH supply — small leaf-shaped slots along the bottom edge
function drawMunchSlot(x,y,filled,alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = filled ? '#5f9a44' : 'transparent';
  ctx.strokeStyle = '#f4e9d8';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.ellipse(x+3, y+3, 2.6, 3.4, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}
function drawMotherMunchRow(total, filled, pulseIndex, pulseAlpha){
  const slotW = 7;
  const startX = (W - total*slotW)/2;
  const y = H-11;
  for(let i=0;i<total;i++){
    const isPulse = (i===pulseIndex);
    drawMunchSlot(startX+i*slotW, y, i<filled, isPulse ? pulseAlpha : 1);
  }
}

function updateComic(){
  frame++;
  const p = comicPanels[comicIndex];
  p.draw(frame);
  overlay.className = 'pos-top-left';
  panelText.style.display = 'block';
  panelText.textContent = p.text;
  hud.style.display = 'none';
  hint.textContent = 'tap / click to continue';
}

canvas.addEventListener('click', ()=>{
  if(state==='comic'){
    comicIndex++;
    frame = 0;
    if(comicIndex >= comicPanels.length){
      startAct0();
    }
  }
});
skipBtn.addEventListener('click', ()=>{
  if(state==='comic') startAct0();
});

/* =========================================================
   ACT 0 — INSTAR 1
   ========================================================= */
let player, others, eatenCells, bridgedCells, munchActions, shadowZone, learnedSilk, silkPromptShown, silkVisualCells;
let instructionsShown, shadowUrgeActive, act0Frame;
let leafSpeckles = null;

function buildLeafTexture(){
  // seeded-ish pseudo-random speckle field, computed once so the leaf
  // has a mottled, illustrated texture instead of a flat fill
  leafSpeckles = [];
  let seed = 1337;
  const rnd = ()=>{ seed = (seed*9301+49297) % 233280; return seed/233280; };
  for(let i=0;i<140;i++){
    leafSpeckles.push({
      x: rnd()*W, y: rnd()*H,
      r: 1 + rnd()*1.6,
      tone: rnd() < 0.5 ? 'dark' : 'light'
    });
  }
}

function startAct0(){
  state = 'act0';
  setGrid(4);
  overlay.style.display='none';
  skipBtn.style.display='none';
  hud.style.display='flex';
  renderHUD();
  setGameplayControlsVisible(true);
  if(!leafSpeckles) buildLeafTexture();

  // anchors are the TOP cell of a 1-wide x 3-tall body
  player = {gx:20, gy:14};
  others = [
    {gx:10,gy:8}, {gx:28,gy:10}, {gx:16,gy:24}, // original three
    {gx:34,gy:22}, {gx:5,gy:18}                 // two new
  ];
  eatenCells = new Set(); // "gx,gy" keys — visual: which cells are chewed away
  bridgedCells = new Set(); // "gx,gy" keys — holes silk has bridged, safe to cross
  munchActions = 0;       // progress counter — one per successful munch
  shadowZone = {gx:4, gy:4, w:6, h:6};
  learnedSilk = false;
  silkPromptShown = false;
  silkVisualCells = [];
  instructionsShown = false;
  shadowUrgeActive = false;
  shadowHintShown = false;
  act0Frame = 0;

  hint.textContent = 'WASD / arrows: move    SPACE: eat anywhere';
  requestAnimationFrame(gameLoop);
}

// bounding box of a 1x3 body anchored at (gx,gy)
function bodyBox(a){ return {x0:a.gx, y0:a.gy, x1:a.gx+BODY_W-1, y1:a.gy+BODY_H-1}; }
// 1-cell border around the body -> 3 wide x 5 tall no-eat zone
function bufferBox(a){ const b=bodyBox(a); return {x0:b.x0-1,y0:b.y0-1,x1:b.x1+1,y1:b.y1+1}; }
function inBox(gx,gy,box){ return gx>=box.x0 && gx<=box.x1 && gy>=box.y0 && gy<=box.y1; }

function overlapsBody(gx,gy,a){ return inBox(gx,gy,bodyBox(a)); }

function tryMove(dx,dy){
  if(state!=='act0') return;
  const nx = Math.min(COLS-BODY_W, Math.max(0, player.gx+dx));
  const ny = Math.min(ROWS-BODY_H, Math.max(0, player.gy+dy));
  const trial = {gx:nx, gy:ny};
  const tb = bodyBox(trial);
  const blockedByOther = others.some(o=>{
    const ob = bodyBox(o);
    return !(tb.x1<ob.x0 || tb.x0>ob.x1 || tb.y1<ob.y0 || tb.y0>ob.y1);
  });
  // the head (leading/top segment) can always poke into a hole; only the
  // trailing body segments below it need a silk bridge to cross one
  let blockedByHole = false;
  for(let gx=tb.x0; gx<=tb.x1 && !blockedByHole; gx++){
    for(let gy=tb.y0+1; gy<=tb.y1; gy++){
      const key = gx+','+gy;
      if(eatenCells.has(key) && !bridgedCells.has(key)){ blockedByHole = true; break; }
    }
  }
  if(blockedByHole && (dx!==0||dy!==0) && !(nx===player.gx && ny===player.gy)){
    showToast('A gap in the leaf — spin silk nearby to bridge it.', 1800);
  }
  if(!blockedByOther && !blockedByHole){
    player.gx = nx; player.gy = ny;
  }
  checkShadow();
}

function tryEat(){
  if(state!=='act0') return;
  // bite center is the head cell (top of the body)
  const hx = player.gx, hy = player.gy;
  const headKey = hx+','+hy;

  const tooClose = others.some(o => inBox(hx,hy, bufferBox(o)));
  if(tooClose){
    showToast('Too close to another caterpillar — a 1-cell border keeps you out.');
    return;
  }
  if(eatenCells.has(headKey)){
    showToast('Already munched down to nothing here. Move to a fresh spot.');
    return;
  }

  // bite a 3-wide x 2-tall patch: first row on the head, second row above
  // it — not below, so the hole doesn't sit under the body's lower segments
  for(let dx=-1; dx<=1; dx++){
    for(let dy=-1; dy<=0; dy++){
      const gx = hx+dx, gy = hy+dy;
      if(gx<0 || gy<0 || gx>=COLS || gy>=ROWS) continue;
      if(others.some(o => overlapsBody(gx,gy,o))) continue; // don't dig under a caterpillar
      eatenCells.add(gx+','+gy);
    }
  }

  munchActions++;

  if(munchActions <= 4){
    munchFilled = Math.min(TOTAL_MUNCH, 1 + munchActions);
    renderHUD();
  }

  if(munchActions === 2 && !silkPromptShown){
    silkPromptShown = true;
    showToast('New instinct stirs... press S to spin silk.', 3200);
  }

  if(munchActions === 5){
    showToast('Full at last. But something pulls you toward the shadows...', 3200);
    shadowUrgeActive = true;
  }
}

function trySilk(){
  if(!silkPromptShown) return;
  learnedSilk = true;
  const exists = silkVisualCells.some(c=>c.gx===player.gx && c.gy===player.gy);
  if(!exists) silkVisualCells.push({gx:player.gx, gy:player.gy});

  // bridge any holes touching the body or its immediate 1-cell border
  const b = bufferBox(player);
  let bridgedAny = false;
  for(let gx=b.x0; gx<=b.x1; gx++){
    for(let gy=b.y0; gy<=b.y1; gy++){
      const key = gx+','+gy;
      if(eatenCells.has(key) && !bridgedCells.has(key)){
        bridgedCells.add(key);
        bridgedAny = true;
      }
    }
  }

  if(shadowUrgeActive && playerInShadowZone()){
    showToast('Silk spun in the dark. Safe, just in time.', 1800);
    startStorm();
  } else if(bridgedAny){
    showToast('Silk bridge spun across the gap.', 1800);
  } else {
    showToast('Silk spun. It will keep you safe.', 1600);
  }
}

function playerInShadowZone(){
  return player.gx >= shadowZone.gx && player.gx < shadowZone.gx+shadowZone.w &&
         player.gy >= shadowZone.gy && player.gy < shadowZone.gy+shadowZone.h;
}

let shadowHintShown = false;
function checkShadow(){
  if(!shadowUrgeActive) return;
  if(playerInShadowZone() && !shadowHintShown){
    shadowHintShown = true;
    showToast('The shadows feel safe... but instinct says spin silk here.', 3000);
  }
}

/* ---- rendering act0 ---- */
function drawAct0(){
  // base leaf: radial gradient, light center to darker edge
  const grad = ctx.createRadialGradient(W/2,H/2,10, W/2,H/2, W*0.75);
  grad.addColorStop(0, '#5f8a48');
  grad.addColorStop(0.55, '#4f7942');
  grad.addColorStop(1, '#2f5233');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // speckle texture (mottling)
  leafSpeckles.forEach(s=>{
    ctx.fillStyle = s.tone==='dark' ? 'rgba(20,40,15,0.18)' : 'rgba(200,230,170,0.12)';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });

  // veins: central rib + side veins
  ctx.strokeStyle='rgba(20,40,15,0.28)';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
  for(let y=8; y<H; y+=16){
    ctx.beginPath(); ctx.moveTo(W/2,y); ctx.lineTo(W/2-24,y-6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2,y); ctx.lineTo(W/2+24,y-6); ctx.stroke();
  }

  // shadow zone
  const shadowPulse = shadowUrgeActive ? (0.30 + 0.15*Math.sin(act0Frame/10)) : 0.20;
  ctx.fillStyle = `rgba(10,10,20,${shadowPulse})`;
  ctx.fillRect(shadowZone.gx*CELL, shadowZone.gy*CELL, shadowZone.w*CELL, shadowZone.h*CELL);
  if(shadowUrgeActive){
    ctx.strokeStyle = 'rgba(244,233,216,0.6)';
    ctx.strokeRect(shadowZone.gx*CELL+0.5, shadowZone.gy*CELL+0.5, shadowZone.w*CELL-1, shadowZone.h*CELL-1);
  }

  // eaten cells — hidden while a caterpillar's body still covers them,
  // revealed once they move off. Bridged holes show silk planks over the gap.
  eatenCells.forEach(key=>{
    const [gx,gy] = key.split(',').map(Number);
    const coveredByPlayer = overlapsBody(gx,gy,player);
    const coveredByOther = others.some(o=>overlapsBody(gx,gy,o));
    if(coveredByPlayer || coveredByOther) return;

    const x = gx*CELL, y = gy*CELL;
    px(x,y,CELL,CELL,'#1c1d2e');
    ctx.strokeStyle='rgba(0,0,0,0.4)';
    ctx.lineWidth=0.5;
    ctx.strokeRect(x+0.5,y+0.5,CELL-1,CELL-1);

    if(bridgedCells.has(key)){
      ctx.strokeStyle='rgba(244,233,216,0.8)';
      ctx.lineWidth=0.7;
      ctx.beginPath(); ctx.moveTo(x,y+1); ctx.lineTo(x+CELL,y+1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x,y+CELL-1); ctx.lineTo(x+CELL,y+CELL-1); ctx.stroke();
    }
  });

  // silk
  silkVisualCells.forEach(c=>{
    ctx.strokeStyle='rgba(244,233,216,0.55)';
    ctx.lineWidth=0.6;
    ctx.strokeRect(c.gx*CELL-2, c.gy*CELL-2, BODY_W*CELL+4, BODY_H*CELL+4);
  });

  // other caterpillars
  others.forEach(o=>drawCaterpillar(o.gx,o.gy,'#8ba86a','#5f7a48'));

  // player
  drawCaterpillar(player.gx, player.gy, '#f0954f','#c95f1e');
}

// 1-cell wide x 3-cell tall segmented body, shaded for an illustrated look
function drawCaterpillar(gx,gy,baseColor,shadeColor){
  const x = gx*CELL, y = gy*CELL;
  const w = BODY_W*CELL, h = BODY_H*CELL;

  // outline
  px(x-0.5,y-0.5,w+1,h+1,'#1c1d2e');

  for(let seg=0; seg<BODY_H; seg++){
    const sy = y + seg*CELL;
    const alt = seg % 2 === 0;
    px(x, sy, w, CELL, alt ? baseColor : shadeColor);
    // highlight sliver
    px(x, sy, 1, CELL, 'rgba(255,255,255,0.25)');
    // shadow sliver
    px(x+w-1, sy, 1, CELL, 'rgba(0,0,0,0.22)');
    // little nub legs on the lower two segments
    if(seg>0){
      px(x-1, sy+CELL-1, 1,1, '#2b2320');
      px(x+w, sy+CELL-1, 1,1, '#2b2320');
    }
  }
  // eyes on the head (top segment)
  px(x, y, 1,1, '#1c1d2e');
}

/* ---------- STORM CUTSCENE ---------- */
let stormFrame, flashTimes, boltT, boltX;
function startStorm(){
  state = 'storm';
  overlay.className = '';
  panelText.style.display = 'none';
  hud.style.display='none';
  hint.textContent='';
  setGameplayControlsVisible(false);
  stormFrame = 0;
  boltT = 0;
  // irregular, spaced-out strikes for a slower, more dramatic build
  flashTimes = [20,55,95,140,190];
}
function drawStorm(){
  clear('#1c1d2e');
  // rain streaks — slightly heavier for drama
  ctx.strokeStyle='rgba(167,216,232,0.32)';
  for(let i=0;i<26;i++){
    const rx = (i*11 + (stormFrame*2.4))%W;
    const ry = (i*7 + stormFrame*4)%H;
    ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-3,ry+9); ctx.stroke();
  }
  // jagged yellow bolts instead of full-screen flashes — no strobing,
  // safe for photosensitive players
  if(flashTimes.includes(stormFrame)){
    boltT = 10;
    boltX = 20 + (stormFrame*37) % (W-40);
  }
  if(boltT > 0){
    drawBolt(boltX, 10-boltT);
    boltT--;
  }
  stormFrame++;
  if(stormFrame===210){
    boltT = 0;
    overlay.className = 'pos-top-left';
    panelText.style.display='block';
    panelText.textContent = 'The storm rages through the night.';
    overlay.style.display='flex';
  }
  if(stormFrame===370){
    startMorning();
  }
}
// a jagged bolt drawn as lines only — luminance stays local, never full-screen
function drawBolt(x, age){
  const fade = Math.max(0, 1 - age*0.1);
  let bx = x, by = 0;
  ctx.beginPath();
  ctx.moveTo(bx, by);
  for(let i=1; i<=7; i++){
    bx += (i%2===0 ? 1 : -1) * (3 + ((x*i*7)%6));
    by += 9 + ((x*i*13)%5);
    ctx.lineTo(bx, by);
  }
  ctx.lineWidth = 2.2;
  ctx.strokeStyle = `rgba(255,224,138,${0.85*fade})`;
  ctx.stroke();
  ctx.lineWidth = 0.8;
  ctx.strokeStyle = `rgba(255,245,200,${0.9*fade})`;
  ctx.stroke();
}

/* =========================================================
   ACT 1 — INSTAR 2
   A whole milkweed plant: stem, three leaves, and the flower
   buds at the top (just about to open — a favorite food, worth
   double munch). Two clover mites lurk; SHAKE fast to lose one
   munch instead of two. Other instars share the plant.
   ========================================================= */
const P1_H = 4; // instar 2 body: 1 cell wide x 4 tall
let p1, others1, eaten1, region1, mite, mites1, mite2Spawned;
let act1Frame, budNoteShown, shakeWiggle;
let hang2, spider, giant, giantDone, shadowNoteShown, lastMunch2; // act 2: silk-drop, spider, giant instar 5

function inEllipse(gx,gy,cx,cy,rx,ry){
  const ex=(gx-cx)/rx, ey=(gy-cy)/ry;
  return ex*ex+ey*ey <= 1;
}

// plant geometry is data: leaves as ellipses, stem pieces as rects, one bud
// cluster — buildRegions turns whichever set is loaded into the cell map
let plantLeaves, plantStems, plantBuds, shadowCells;
function buildRegions(){
  region1 = new Map(); // "gx,gy" -> 'bud'|'leafN'|'stem'
  const mark=(gx,gy,r)=>{
    if(gx>=0&&gy>=0&&gx<COLS&&gy<ROWS && !region1.has(gx+','+gy)) region1.set(gx+','+gy,r);
  };
  const b = plantBuds; // marked first so buds win the top of the stem
  for(let gx=Math.floor(b[0]-b[2]);gx<=Math.ceil(b[0]+b[2]);gx++)
    for(let gy=Math.max(0,Math.floor(b[1]-b[3]));gy<=Math.ceil(b[1]+b[3]);gy++)
      if(inEllipse(gx,gy,b[0],b[1],b[2],b[3])) mark(gx,gy,'bud');
  for(let gx=0;gx<COLS;gx++)for(let gy=0;gy<ROWS;gy++)
    for(let i=0;i<plantLeaves.length;i++){
      const l=plantLeaves[i];
      if(inEllipse(gx,gy,l[0],l[1],l[2],l[3])){ mark(gx,gy,'leaf'+(i+1)); break; }
    }
  plantStems.forEach(s=>{
    for(let gx=s[0];gx<s[0]+s[2];gx++)for(let gy=s[1];gy<s[1]+s[3];gy++) mark(gx,gy,'stem');
  });
}

function buildPlant(){ // act 1: a single milkweed plant, close up
  setGrid(4);
  plantLeaves=[[10,22,8,4.6],[29,16,8,4.6],[9,8,7,4.2]];
  plantStems=[[19,2,2,27],[15,21,5,2],[20,15,4,2],[15,7,5,2]];
  plantBuds=[20,3.4,3.4,2.7];
  shadowCells = new Set();
  buildRegions();
}

function buildBush(){ // act 2: zoomed out — the whole milkweed bush
  setGrid(2);
  plantLeaves=[
    [20,48,12,6],[58,42,12,6],[16,30,10,5],
    [62,24,10,5],[28,12,9,4.5],[54,10,8,4]
  ];
  plantStems=[
    [39,4,3,55],            // main stalk
    [31,47,8,3],[42,41,4,3],[26,29,13,3],
    [42,23,10,3],[37,11,2,3],[42,9,4,3]
  ];
  plantBuds=[40,4,5,3];
  buildRegions();
  // cool shade pockets under the big leaves — safe hiding spots
  shadowCells = new Set();
  const shades=[[14,50,5,2.5],[64,44,5,2.5],[10,31,4,2],[68,25,4,2]];
  region1.forEach((r,k)=>{
    if(!r.startsWith('leaf')) return;
    const [gx,gy]=k.split(',').map(Number);
    if(shades.some(s=>inEllipse(gx,gy,s[0],s[1],s[2],s[3]))) shadowCells.add(k);
  });
}

function startAct1(){
  state='act1';
  buildPlant();
  overlay.style.display='none';
  panelText.style.display='none';
  continueBtn.classList.remove('show');
  TOTAL_MUNCH = 10;      // instar 2: double the containers
  munchFilled = 1;       // woke up hungry
  hud.style.display='flex';
  renderHUD();
  setGameplayControlsVisible(true);
  silkBtn.innerHTML = 'SHAKE<br>(S)';

  p1 = {gx:10, gy:19, dir:'v'}; // head cell; body follows; turns as you crawl
  others1 = [
    {gx:4,  gy:21, h:3, kind:1, dir:'h'}, // instar 1 lying across leaf 1
    {gx:8,  gy:7,  h:3, kind:1, dir:'v'}, // instar 1 upright on leaf 3
    {gx:29, gy:13, h:4, kind:2, dir:'h'}  // instar 2 stretched along leaf 2
  ];
  eaten1 = new Set();
  mite = null;
  // exactly two clover mites, each bound to a leaf — never the buds.
  // #1 lurks on your starting leaf; #2 stirs when you reach another leaf.
  mites1 = [
    {gx:3,  gy:22, home:'leaf1', alive:true,  step:0},
    {gx:0,  gy:0,  home:null,    alive:false, step:0}
  ];
  mite2Spawned = false;
  budNoteShown = false;
  shakeWiggle = 0;
  act1Frame = 0;
  showToast('A whole plant to explore. The stem connects every leaf.', 3000);
  hint.textContent = 'crawl the stem between leaves · SPACE: eat · S: shake';
}

// a body is a run of cells from the head: horizontal or vertical
function cellsOf1(e){
  const cells=[], n=e.h||P1_H;
  for(let i=0;i<n;i++) cells.push(e.dir==='h' ? [e.gx+i,e.gy] : [e.gx,e.gy+i]);
  return cells;
}
function playerCells(){ return cellsOf1({gx:p1.gx, gy:p1.gy, h:p1.h||P1_H, dir:p1.dir}); }

function tryMove1(dx,dy){
  if(state!=='act1' && state!=='act2') return;
  if(state==='act2' && hang2){ showToast('Hanging on silk — climb back up first (S).', 1500); return; }
  // the body turns to follow the crawl: sideways = horizontal, up/down = vertical
  const ph = p1.h||P1_H;
  const dir = dx!==0 ? 'h' : (dy!==0 ? 'v' : p1.dir);
  const nx = Math.min(dir==='h' ? COLS-ph : COLS-1, Math.max(0, p1.gx+dx));
  const ny = Math.min(dir==='v' ? ROWS-ph : ROWS-1, Math.max(0, p1.gy+dy));
  if(!region1.has(nx+','+ny)) return; // head must stay on the plant
  const trial = cellsOf1({gx:nx, gy:ny, h:ph, dir});
  const blocked = others1.some(o=> cellsOf1(o).some(c=> trial.some(t=>t[0]===c[0]&&t[1]===c[1])));
  if(blocked){ showToast('Another caterpillar is in the way.', 1400); return; }
  p1.gx = nx; p1.gy = ny; p1.dir = dir;

  const r = region1.get(nx+','+ny);
  if(r==='bud' && !budNoteShown){
    budNoteShown = true;
    showToast('Milkweed buds, just about to open. Your favorite — double munch!', 3000);
  }
  // the second mite wakes the first time you set foot on a leaf that
  // isn't the one you hatched on
  if(!mite2Spawned && (r==='leaf2' || r==='leaf3')){
    mite2Spawned = true;
    const m = mites1[1];
    m.home = r; m.alive = true;
    if(r==='leaf2'){ m.gx=35; m.gy=16; } else { m.gx=3; m.gy=8; }
    showToast('Something small and red stirs on this leaf...', 2200);
  }
}

function startMite(m){
  m.alive = false; // off the plant — it's on YOU now
  mite = {presses:0, deadline: act1Frame + 240};
  showToast('A clover mite crawls onto you! SHAKE — press S fast, 3 times!', 3200);
  hint.textContent = 'SHAKE! press S (or the SHAKE button) ×3 — quickly!';
}

function tryShake(){
  if(state!=='act1') return;
  shakeWiggle = 8;
  if(!mite){ showToast('You wiggle. Nothing clinging to you — for now.', 1200); return; }
  mite.presses++;
  if(mite.presses>=3){
    munchFilled = Math.max(0, munchFilled-1);
    renderHUD();
    showToast('Flung it off! Only one munch lost.', 2400);
    endMite();
  }
}

function endMite(){
  mite = null;
  hint.textContent = 'crawl the stem between leaves · SPACE: eat · S: shake';
}

function updateAct1(){
  if(shakeWiggle>0) shakeWiggle--;
  // each mite patrols only its own leaf (never the stem, never the buds).
  // It hunts you while you're on its leaf, and wanders when you're not.
  if(!mite) mites1.forEach(m=>{
    if(!m.alive) return;
    if(++m.step < 22) return;
    m.step = 0;
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]]
      .filter(d=>region1.get((m.gx+d[0])+','+(m.gy+d[1]))===m.home);
    if(!dirs.length) return;
    let pick;
    if(region1.get(p1.gx+','+p1.gy)===m.home){
      let bd = 1e9;
      dirs.forEach(d=>{
        const dist = Math.abs(m.gx+d[0]-p1.gx) + Math.abs(m.gy+d[1]-(p1.gy+1));
        if(dist < bd){ bd = dist; pick = d; }
      });
    } else {
      pick = dirs[(m.gx*7 + m.gy*13 + act1Frame) % dirs.length];
    }
    m.gx += pick[0]; m.gy += pick[1];
    if(playerCells().some(c=>Math.abs(m.gx-c[0])<=1 && Math.abs(m.gy-c[1])<=1)){
      startMite(m);
    }
  });
  if(mite && act1Frame > mite.deadline){
    munchFilled = Math.max(0, munchFilled-2);
    renderHUD();
    showToast('Too slow — the mite drank deep. Two munch lost.', 2600);
    endMite();
  }
}

function tryEat1(){
  if(state!=='act1' && state!=='act2') return;
  if(state==='act2' && hang2){ showToast('Hanging on silk — climb back up first (S).', 1500); return; }
  const hx=p1.gx, hy=p1.gy, key=hx+','+hy;
  const r = region1.get(key);
  if(!r) return;
  if(r==='stem'){ showToast('Nothing to munch on the bare stem.', 1600); return; }
  if(others1.some(o=> cellsOf1(o).some(c=>Math.abs(hx-c[0])<=1 && Math.abs(hy-c[1])<=1))){
    showToast('Too close to another caterpillar — give them a 1-cell border.');
    return;
  }
  // a rich bud always fills two — with only one container left,
  // the last munch has to come from a leaf
  if(r==='bud' && TOTAL_MUNCH - munchFilled < 2){
    showToast('Only one munch left — finish with a leaf bite, not a rich bud.', 2600);
    return;
  }
  let bites=0;
  if(r==='bud'){
    // buds are small and dense: one dainty bite and the bud is gone
    if(!eaten1.has(key)){ eaten1.add(key); bites=1; }
  } else {
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=0;dy++){
      const gx=hx+dx, gy=hy+dy, k=gx+','+gy;
      const rr = region1.get(k);
      if(!rr || rr==='stem' || rr==='bud' || eaten1.has(k)) continue;
      if(others1.some(o=> cellsOf1(o).some(c=>c[0]===gx && c[1]===gy))) continue;
      eaten1.add(k); bites++;
    }
  }
  if(!bites){ showToast('Munched bare here. Crawl to a fresh spot.', 1600); return; }
  const gain = r==='bud' ? 2 : 1;
  munchFilled = Math.min(TOTAL_MUNCH, munchFilled+gain);
  if(state==='act2') lastMunch2 = act1Frame; // munching makes noise the spider feels
  renderHUD();
  if(r==='bud') showToast('Bud! Soft and sweet — two munch at once!', 1800);
  if(munchFilled>=TOTAL_MUNCH){ state==='act2' ? finishAct2() : finishAct1(); }
}

function finishAct1(){
  state='act1molt';
  setGameplayControlsVisible(false);
  hud.style.display='none';
  hint.textContent='';
  overlay.className = 'pos-top-left';
  overlay.style.display='flex';
  panelText.style.display='block';
  panelText.textContent = 'Ten munches full. Your skin feels tight... too tight. Time to molt.';
  continueBtn.classList.add('show');
}

/* ---- act 1 rendering ---- */
function skyColor1(gy){
  const t = gy/ROWS;
  const a=[167,216,232], b=[247,201,160];
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;
}
function drawAct1(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#a7d8e8'); g.addColorStop(1,'#f7c9a0');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  px(140,8,12,12,'#ffe08a'); // morning sun

  // stem + branches (draw under leaves)
  ctx.fillStyle='#5c6b3a';
  plantStems.forEach(s=>ctx.fillRect(s[0]*CELL, s[1]*CELL, s[2]*CELL, s[3]*CELL));

  // leaves as smooth ellipses with a vein
  plantLeaves.forEach(l=>{
    ctx.fillStyle='#4f7942';
    ctx.beginPath();
    ctx.ellipse((l[0]+0.5)*CELL,(l[1]+0.5)*CELL,(l[2]+0.5)*CELL,(l[3]+0.5)*CELL,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='rgba(20,40,15,0.35)'; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo((l[0]-l[2])*CELL+3,(l[1]+0.5)*CELL);
    ctx.lineTo((l[0]+l[2])*CELL+1,(l[1]+0.5)*CELL);
    ctx.stroke();
  });

  // cool shade pockets under the big leaves — safe hiding spots
  shadowCells.forEach(k=>{
    if(eaten1.has(k)) return;
    const [gx,gy]=k.split(',').map(Number);
    ctx.fillStyle='rgba(15,20,30,0.30)';
    ctx.fillRect(gx*CELL, gy*CELL, CELL, CELL);
  });

  // bud cluster: bright, glossy orbs with pink tips — almost open
  region1.forEach((r,k)=>{
    if(r!=='bud' || eaten1.has(k)) return;
    const [gx,gy]=k.split(',').map(Number);
    px(gx*CELL,gy*CELL,CELL,CELL,'#d2ec9e');
    if(gy<=3) px(gx*CELL+1,gy*CELL,2,2,'#f2b0d4');
    if((gx+gy)%3===0) px(gx*CELL+2,gy*CELL+2,1,1,'#fff7d6');
  });

  // munched-away cells show sky through the leaf
  eaten1.forEach(k=>{
    const [gx,gy]=k.split(',').map(Number);
    const coveredByPlayer = playerCells().some(c=>c[0]===gx && c[1]===gy);
    const coveredByOther = others1.some(o=>cellsOf1(o).some(c=>c[0]===gx && c[1]===gy));
    if(coveredByPlayer || coveredByOther) return;
    px(gx*CELL,gy*CELL,CELL,CELL, skyColor1(gy));
  });

  // the two mites, hunting — tiny red specks with darting legs
  mites1.forEach(m=>{
    if(!m.alive) return;
    const jig = Math.sin((act1Frame + m.gx*9)/5);
    px(m.gx*CELL+1, m.gy*CELL+1+jig, 2,2, '#c04030');
    px(m.gx*CELL,   m.gy*CELL+2, 1,1, '#802018');
    px(m.gx*CELL+3, m.gy*CELL+2, 1,1, '#802018');
  });

  // neighbors: pale instar 1s and a banded instar 2, some upright, some lying flat
  others1.forEach(o=>{
    if(o.kind===1) drawWorm1(cellsOf1(o), ['#c9d8a8','#a8b888'], false);
    else drawWorm1(cellsOf1(o), ['#2b2320','#e8c84a','#f4e9d8'], false);
  });

  // player: banded, turning with its crawl — instar 3 gets visibly long antennae.
  // (hidden here while dangling on silk; the overlay draws that pose)
  if(!(state==='act2' && hang2))
    drawWorm1(playerCells(), ['#2b2320','#e8c84a','#f4e9d8'], true, state==='act2' ? 5 : 2);

  // the clinging mite, jittering on your head
  if(mite){
    const jx = Math.sin(act1Frame/2)*1.5;
    px(p1.gx*CELL+jx+1, p1.gy*CELL-2, 2,2, '#c04030');
  }
}

/* =========================================================
   ACT 2 — INSTAR 3
   Zoomed out to the whole milkweed bush: six leaves, a tall
   stalk, instars of every size. Shadows keep their meaning —
   the cool shade pockets under the big leaves are SAFE, and
   so is dangling on silk. The level enemy is a wandering
   spider you can always see coming. And once, mid-meal, a
   GIANT instar 5 barrels through on its way to chrysalis —
   it means no harm, but everyone gets knocked aside. Your
   silk anchor is why you don't fall off.
   ========================================================= */
function startAct2(){
  state='act2';
  buildBush();
  overlay.style.display='none';
  panelText.style.display='none';
  continueBtn.classList.remove('show');
  TOTAL_MUNCH = 15;
  munchFilled = 2;
  hud.style.display='flex';
  renderHUD();
  setGameplayControlsVisible(true);
  silkBtn.innerHTML = 'DROP<br>(S)';

  p1 = {gx:20, gy:44, dir:'v', h:5}; // instar 3: longer body, real antennae
  others1 = [ // instars of all sizes share the bush
    {gx:14, gy:47, h:2, kind:1, dir:'h'},
    {gx:58, gy:40, h:3, kind:1, dir:'v'},
    {gx:60, gy:24, h:4, kind:2, dir:'h'},
    {gx:26, gy:10, h:5, kind:2, dir:'v'},
    {gx:52, gy:8,  h:6, kind:2, dir:'h'}
  ];
  eaten1 = new Set();
  mite = null; mites1 = []; mite2Spawned = true; // the mites had their day
  budNoteShown = true;
  shakeWiggle = 0;
  hang2 = false;
  shadowNoteShown = false;
  spider = {gx:40, gy:14, step:0, cool:0, chasing:false};
  lastMunch2 = -9999; // the spider hunts by vibration — quiet until you munch
  giant = {active:false, x:0, row:0, hitP:false};
  giantDone = false;
  act1Frame = 0;
  showToast('The whole bush, and a bigger hunger: 15 munches. Something is prowling...', 3400);
  hint.textContent = 'leaf shadows hide you · S: drop on silk · watch for the spider';
}

function tryDrop(){
  if(state!=='act2') return;
  hang2 = !hang2;
  if(hang2){
    silkBtn.innerHTML = 'CLIMB<br>(S)';
    showToast('You drop on a silk line, anchored and out of reach.', 1800);
  } else {
    silkBtn.innerHTML = 'DROP<br>(S)';
    showToast('You climb the silk back to your perch.', 1500);
  }
}

function playerHidden(){
  const key = p1.gx+','+p1.gy;
  return hang2 || (shadowCells.has(key) && !eaten1.has(key));
}

// breadth-first distances across the plant from one cell — the spider's map
function bfsFrom(sx,sy){
  const dist = new Map([[sx+','+sy,0]]);
  const q=[[sx,sy]];
  for(let qi=0; qi<q.length; qi++){
    const [x,y]=q[qi];
    const d=dist.get(x+','+y);
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const k=(x+dx)+','+(y+dy);
      if(region1.has(k) && !dist.has(k)){ dist.set(k,d+1); q.push([x+dx,y+dy]); }
    }
  }
  return dist;
}

function updateAct2(){
  if(shakeWiggle>0) shakeWiggle--;
  const hidden = playerHidden();
  if(!shadowNoteShown && !hang2 && hidden){
    shadowNoteShown = true;
    showToast('Cool leaf-shade. The spider cannot see you here.', 2400);
  }

  // the spider: prowls the bush along its real geometry, chases what it can
  // sense, never enters the buds. Pursuit follows a BFS distance field from
  // the player so it navigates around leaves instead of pacing at dead ends.
  const s = spider;
  if(s.cool>0) s.cool--;
  if(++s.step >= (s.chasing?10:16)){
    s.step = 0;
    const dmap = bfsFrom(p1.gx, p1.gy);
    const pathDist = dmap.get(s.gx+','+s.gy) ?? 999;
    const heardYou = act1Frame - lastMunch2 < 240; // ~4s of munching vibrations
    s.chasing = !hidden && s.cool<=0 && pathDist<14;
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]].filter(d=>{
      const r = region1.get((s.gx+d[0])+','+(s.gy+d[1]));
      return r && r!=='bud';
    });
    if(dirs.length){
      let pick;
      const toward = ()=>{ let bd=1e9,p=null;
        dirs.forEach(d=>{ const dd=dmap.get((s.gx+d[0])+','+(s.gy+d[1])) ?? 998; if(dd<bd){bd=dd;p=d;} });
        return p; };
      if(s.chasing){
        pick = toward();
      } else if(s.cool>0){ // slinks away after a lunge
        let bd=-1;
        dirs.forEach(d=>{ const dd=dmap.get((s.gx+d[0])+','+(s.gy+d[1])) ?? 998; if(dd>bd){bd=dd;pick=d;} });
      } else if(!hidden && heardYou){
        // fresh munching vibrations — it stalks toward them
        pick = toward();
      } else {
        // quiet bush — it wanders, no trail to follow
        pick = dirs[(s.gx*7 + s.gy*13 + act1Frame) % dirs.length];
      }
      if(pick){ s.gx += pick[0]; s.gy += pick[1]; }
    }
    if(!hidden && s.cool<=0 && playerCells().some(c=>Math.abs(s.gx-c[0])<=1 && Math.abs(s.gy-c[1])<=1)){
      munchFilled = Math.max(0, munchFilled-3);
      renderHUD();
      shakeWiggle = 14;
      s.cool = 780; // a long retreat — you've earned a quiet stretch
      s.chasing = false;
      showToast('The spider lunges! You wrench free — three munch lost.', 3000);
    }
  }

  // the giant instar 5, once, when you're well into your meal
  if(!giantDone && !giant.active && munchFilled>=7){
    giant.active = true; giant.x = -15; giant.hitP = false;
    giant.row = Math.max(6, Math.min(ROWS-10, p1.gy-1));
    showToast('The whole bush shakes... something enormous is coming!', 2800);
  }
  if(giant.active && act1Frame%3===0){
    giant.x++;
    const inPath = (gx,gy)=> gx>=giant.x && gx<giant.x+14 && gy>=giant.row && gy<giant.row+4;
    if(!hang2 && !giant.hitP && playerCells().some(c=>inPath(c[0],c[1]))){
      giant.hitP = true;
      const ny = Math.max(0, Math.min(ROWS-(p1.h||P1_H), p1.gy + (p1.gy<=giant.row+1 ? -6 : 6)));
      if(region1.has(p1.gx+','+ny)) p1.gy = ny;
      shakeWiggle = 16;
      showToast('The giant instar 5 barrels through! Your silk anchor holds.', 3000);
    }
    others1.forEach(o=>{
      if(!o.pushed && cellsOf1(o).some(c=>inPath(c[0],c[1]))){
        o.pushed = true;
        const ny = Math.max(0, Math.min(ROWS-o.h, o.gy + (o.gy<=giant.row+1 ? -5 : 5)));
        if(region1.has(o.gx+','+ny)) o.gy = ny;
      }
    });
    if(giant.x > COLS+2){
      giant.active = false; giantDone = true;
      showToast('It lumbers off to find a place for its chrysalis. Good luck, big one.', 3200);
    }
  }
}

function drawAct2Overlay(){
  // dangling on a silk line below the perch, anchored
  if(hang2){
    const hx = p1.gx*CELL + CELL/2, top = p1.gy*CELL;
    ctx.strokeStyle='rgba(244,233,216,0.85)';
    ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.moveTo(hx, top); ctx.lineTo(hx, top+16); ctx.stroke();
    const bands=['#2b2320','#e8c84a','#f4e9d8'];
    const sway = Math.sin(act1Frame/16)*1.2;
    for(let i=0;i<5;i++) px(hx-2+sway, top+16+i*3, 4, 3, bands[i%3]);
  }
  // the spider, legs and all — red-eyed while it has you in sight
  const sx = spider.gx*CELL, sy = spider.gy*CELL;
  ctx.strokeStyle='#3a2a20'; ctx.lineWidth=0.7;
  for(let i=-1;i<=2;i++){
    ctx.beginPath(); ctx.moveTo(sx+1, sy+1); ctx.lineTo(sx-3, sy-2+i*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+2, sy+1); ctx.lineTo(sx+6, sy-2+i*2); ctx.stroke();
  }
  px(sx-1, sy-1, 5, 4, '#4a3020');
  px(sx,   sy-2, 3, 2, '#5a3c28');
  if(!playerHidden() && spider.cool<=0 && Math.abs(spider.gx-p1.gx)+Math.abs(spider.gy-p1.gy)<16){
    px(sx, sy-2, 1, 1, '#e03030');
    px(sx+2, sy-2, 1, 1, '#e03030');
  }
  // the giant instar 5, crossing the bush
  if(giant.active){
    const bands=['#2b2320','#e8c84a','#f4e9d8'];
    const gy = giant.row*CELL;
    for(let cx=0; cx<14; cx++){
      const gx = giant.x+cx;
      if(gx<0 || gx>=COLS) continue;
      px(gx*CELL, gy, CELL, 4*CELL, bands[cx%3]);
      px(gx*CELL, gy, CELL, 1, 'rgba(255,255,255,0.25)');
    }
    const headPx = Math.min(COLS-1, giant.x+13)*CELL + CELL;
    ctx.strokeStyle='#2b2320'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(headPx, gy); ctx.lineTo(headPx+4, gy-5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(headPx, gy+4*CELL); ctx.lineTo(headPx+4, gy+4*CELL+5); ctx.stroke();
  }
}

function finishAct2(){
  state='act2molt';
  setGameplayControlsVisible(false);
  hud.style.display='none';
  hint.textContent='';
  overlay.className = 'pos-top-left';
  overlay.style.display='flex';
  panelText.style.display='block';
  panelText.textContent = 'Fifteen munches full, and the spider never got you. The tight-skin feeling again... molt number three.';
  continueBtn.classList.add('show');
}

// draws any caterpillar body — horizontal or vertical — from its cells,
// banded head to tail, with nubby antennae poking from the head
function drawWorm1(cells, bands, isPlayer, ant){
  ant = ant || 2; // antenna length: nubs for instar 2, real ones for instar 3
  const wob = isPlayer && shakeWiggle>0 ? Math.sin(act1Frame*1.6)*1.5 : 0;
  const xs = cells.map(c=>c[0]), ys = cells.map(c=>c[1]);
  const x0 = Math.min(...xs)*CELL+wob, y0 = Math.min(...ys)*CELL;
  px(x0-0.5, y0-0.5, (Math.max(...xs)-Math.min(...xs)+1)*CELL+1,
     (Math.max(...ys)-Math.min(...ys)+1)*CELL+1, '#1c1d2e');
  cells.forEach((c,i)=>{
    const sx = c[0]*CELL+wob, sy = c[1]*CELL;
    px(sx, sy, CELL, CELL, bands[i%bands.length]);
    px(sx, sy, 1, CELL, 'rgba(255,255,255,0.25)');
  });
  const h = cells[0], horizontal = cells.length>1 && cells[1][1]===h[1];
  const hx = h[0]*CELL+wob, hy = h[1]*CELL;
  if(horizontal){
    px(hx-ant, hy, ant,1, '#2b2320');
    px(hx-ant, hy+CELL-1, ant,1, '#2b2320');
  } else {
    px(hx, hy-ant, 1,ant, '#2b2320');
    px(hx+CELL-1, hy-ant, 1,ant, '#2b2320');
  }
}

function drawMolt(t){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#a7d8e8'); g.addColorStop(1,'#f7c9a0');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  px(140,8,12,12,'#ffe08a');
  // the well-munched plant — both leaves grow from the stem
  ctx.fillStyle='#5c6b3a';
  ctx.fillRect(76, 8, 8, 108);
  drawLeafBlob(14,78,66,28,'#3d5a30'); // left leaf, tip meets the stem
  drawLeafBlob(82,52,64,26,'#3d5a30'); // right leaf, attached at the stem
  // the molting instar 2 clings vertically to the stem, breathing
  const bob = Math.sin(t/14)*0.8;
  const bands=['#2b2320','#e8c84a','#f4e9d8'];
  for(let i=0;i<5;i++) px(77, 42+bob+i*4, 6, 4, bands[i%3]);
  // little nubby antennae — next instar, they'll be long enough to notice
  px(77, 39+bob, 1, 3, '#2b2320');
  px(82, 39+bob, 1, 3, '#2b2320');
  // its shed skin, crumpled at the base of the stem
  px(72,112,10,3,'#6e5334');
  px(74,110,6,2,'#8a6a42');
  // a little instar 1 hangs upside down beneath the right leaf...
  const bob2 = Math.sin(t/17+2)*0.8;
  for(let i=0;i<3;i++) px(112, 76+bob2+i*3, 4, 3, i%2 ? '#a8b888':'#c9d8a8');
  px(113, 85+bob2, 2, 2, '#2b2320'); // head pointing down
  // ...beside the skin it wriggled out of, piled on the leaf
  px(120,62,7,3,'#6e5334');
  px(122,60,4,2,'#8a6a42');
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
function gameLoop(){
  if(state==='comic'){
    updateComic();
  } else if(state==='act0'){
    act0Frame++;
    drawAct0();
  } else if(state==='storm'){
    drawStorm();
  } else if(state==='morning'){
    drawMorning(act0Frame++);
  } else if(state==='instar2wake'){
    drawInstar2Wake(act0Frame++);
  } else if(state==='act1'){
    act1Frame++;
    updateAct1();
    drawAct1();
  } else if(state==='act2'){
    act1Frame++;
    updateAct2();
    drawAct1();
    drawAct2Overlay();
  } else if(state==='act1molt' || state==='instar3wake' || state==='act2molt' || state==='instar4wake'){
    drawMolt(act0Frame++);
  }
  requestAnimationFrame(gameLoop);
}

/* ---------- input ---------- */
// dispatch by act: act0 silk, act1 (instar 2) shake, act2 (instar 3) silk-drop
function doMove(dx,dy){ (state==='act1'||state==='act2') ? tryMove1(dx,dy) : tryMove(dx,dy); }
function doEat(){ (state==='act1'||state==='act2') ? tryEat1() : tryEat(); }
function doAction(){ state==='act1' ? tryShake() : (state==='act2' ? tryDrop() : trySilk()); }

window.addEventListener('keydown', (e)=>{
  switch(e.key){
    case 'ArrowUp': case 'w': case 'W': doMove(0,-1); break;
    case 'ArrowDown': doMove(0,1); break;
    case 'ArrowLeft': case 'a': case 'A': doMove(-1,0); break;
    case 'ArrowRight': case 'd': case 'D': doMove(1,0); break;
    case ' ': e.preventDefault(); doEat(); break;
    case 's': case 'S': case 'x': case 'X': doAction(); break;
  }
});

document.getElementById('btnUp').addEventListener('click', ()=>doMove(0,-1));
document.getElementById('btnDown').addEventListener('click', ()=>doMove(0,1));
document.getElementById('btnLeft').addEventListener('click', ()=>doMove(-1,0));
document.getElementById('btnRight').addEventListener('click', ()=>doMove(1,0));
eatBtn.addEventListener('click', doEat);
silkBtn.addEventListener('click', doAction);

/* ---------- boot ---------- */
skipBtn.style.display='block';
requestAnimationFrame(gameLoop);
</script>
